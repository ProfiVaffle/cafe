<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик</title>
    <link rel='stylesheet' href='style.css'> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class='header'>
        <div class='container'>
            <div class='header-line'>
               <div class='header-logo'>
                <a href="index.html">
                    <img src="images/logo.png" alt="Логотип кафе">
                </a>
            </div>
                
                <button class='hamburger' id="hamburger" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                
                <div class='nav' id="nav">
                    <a class='nav-item' href="index.html">ГОЛОВНА</a>
                    <a class='nav-item' href="Menu.html">МЕНЮ</a>
                    <a class='nav-item' href="bio.html">ПРО НАС</a>
                </div>
                <div class='cart'>
                    <a href="cart.html">
                        <img class="cart-img" src="images/cart.png" alt="Кошик">
                    </a>
                </div>
                <div class='phone'>
                    <div class='phone-holder'>
                        <div class='phone-img'>
                            <img src="images/phone.png" alt="">
                        </div>
                        <a class='num' href='bio.html'>+380936454666</a>
                    </div>
                </div>
                <div class='btn'>
                    <a class='button' href='bio.html'>ЗАМОВЛЕННЯ СТОЛУ</a>
                </div>
            </div>
        </div>

        <div class="cart-page">
            <div class="cart-container">
                <div class="cart-container__header">
                    <h5 class="cart-container__title">Ваше замовлення</h5>
                    
                    <div data-cart-empty class="cart-empty-message" role="alert">
                        Кошик порожній
                    </div>
                    
                    <div class="cart-wrapper"></div>
                </div>

                <div class="cart-summary">
                    <p data-cart-delivery class="hidden"> <span class="cart-summary__label">Доставка:</span>  
                        <span class="cart-summary__delivery-cost">50 ₴</span><br>
                    </p>
                    <p>
                        <span class="cart-summary__label">Загальна сума:</span>
                        <span class="cart-summary__total-price">0</span> 
                        <span class="cart-summary__currency">₴</span>
                    </p>
                </div>

                <div id="order-form" class="order-form hidden">
                    <h5 class="cart-container__title">Оформити замовлення</h5>
                    
                    <form id="order-form-element">
                        <div class="form-group">
                            <input type="tel" id="phone-input" class="form-input" placeholder="+380..." maxlength="13">
                            <span id="phone-error" class="form-error"></span>
                        </div>
                        <button type="submit" class="form-submit-button">Замовити</button>
                    </form>
                </div>
            </div>
        </div>
        </div> 
        <div id="order-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Дякуємо за замовлення!</h2>
        <p>Найближчим часом з вами зв'яжуться для підтвердження.</p>
        <button class="btn modal-btn" id="modal-ok">Зрозуміло</button>
    </div>
</div>
    <script src="JavaScript/toggleCartStatus.js"></script>
    <script src="JavaScript/cartPricePlusDelivery.js"></script>
    <script src="JavaScript/cart-render.js"></script>
    <script src="JavaScript/counter-cart.js"></script> 
    <script src="JavaScript/phone-validation.js"></script>
    <script src="JavaScript/burger-menu.js"></script>
</body>
</html>
